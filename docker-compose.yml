services:
  postgres:
    image: postgres:17-alpine
    container_name: mangatrack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mangatrack
      POSTGRES_USER: mangatrack
      POSTGRES_PASSWORD: mangatrack_dev

    ports:
      - "5499:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/infrastructure/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mangatrack -d mangatrack" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mangatrack-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    command: [ "redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction" ]

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: mangatrack-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://mangatrack:mangatrack_dev@postgres:5432/mangatrack
      REDIS_URL: redis://redis:6379
      PORT: 3354
      CORS_ORIGIN: http://localhost:5173

    ports:
      - "3354:3354"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend

    container_name: mangatrack-worker
    restart: unless-stopped

    command: npm run worker:notifications

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://mangatrack:mangatrack_dev@postgres:5432/mangatrack
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: mangatrack-frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:3354

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
