name: mymangatracker

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://mymangatracker:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/mymangatracker
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
  JWT_EXPIRES_IN: 1h
  PORT: 3354
  TRUST_PROXY_HOPS: 1
  CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.production}
  ANILIST_API_URL: https://graphql.anilist.co
  SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM_NAME: MyMangaTracker
  MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@example.invalid}

x-api-image: &api-image
  image: mymangatracker-api:local
  build:
    context: ./backend
    dockerfile: Dockerfile.production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mymangatracker
      POSTGRES_USER: mymangatracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mymangatracker -d mymangatracker]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    <<: *api-image
    environment: *app-environment
    command: [node, scripts/migrate.mjs]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *api-image
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3354/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *api-image
    profiles: [notifications]
    restart: unless-stopped
    environment: *app-environment
    command: [node, dist/workers/notification.worker.js]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    image: mymangatracker-web:local
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
      # Internal API traffic must stay on the Compose network, including behind a session proxy.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
